server:
  address: 0.0.0.0
  port: 8080
  shutdown: graceful

spring:
  application:
    name: ponto-controle-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ponto}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
      connection-timeout: 5000
      validation-timeout: 3000
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  lifecycle:
    timeout-per-shutdown-phase: 10s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db,photoStorage
        liveness:
          include: livenessState,ping
  health:
    defaults:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

app:
  photo-storage:
    path: ${PHOTO_STORAGE_PATH:./data/photos}
  workplace:
    latitude: ${WORKPLACE_LATITUDE:-23.55052}
    longitude: ${WORKPLACE_LONGITUDE:-46.63331}
    radius-meters: ${WORKPLACE_RADIUS_METERS:150}
    max-accuracy-meters: ${WORKPLACE_MAX_ACCURACY_METERS:50}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{requestId:-no-request}] %logger{36} - %msg%n"
  level:
    root: INFO
    org.springframework.security: WARN
